[project]
name = "jambu-data"
version = "0.1.0"
description = "Reproducible environment for building the Jambu CLDF database"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.13.5",
    "html5lib==1.1",
    "pillow==11.3.0",
    "pdfplumber==0.11.7",
    "pybtex==0.26.1",
    "pypdf==6.15.0",
    "pypdfium2==4.30.0",
    "pysem==1.3.0",
    "segments==2.4.0",
    "tqdm==4.67.1",
    "unidecode==1.4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pycldf==1.43.0", "pytest==8.4.1"]
